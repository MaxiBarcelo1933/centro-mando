<!doctype html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <title>Pruebas · Centro de Mando</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; background: #0E1116; color: #F2F4F7; margin: 16px; }
    .ok { color: #6FDCA6; } .fail { color: #FF7A6E; }
    iframe { width: 440px; height: 900px; border: 1px solid #343B48; }
  </style>
</head>
<body>
  <!--
    Pruebas automáticas de la app. OJO: usan la misma base de datos que la app,
    así que correlas solo con el script tools/test.ps1 (usa un perfil temporal de Chrome).
  -->
  <h1 id="summary">Corriendo…</h1>
  <ol id="results"></ol>
  <iframe id="app" title="App bajo prueba"></iframe>

  <script type="module">
    import * as dates from '../js/dates.js';
    import * as store from '../js/store.js';
    import * as db from '../js/db.js';
    import * as periods from '../js/periods.js';

    // Resguardo: las pruebas cargan y borran datos, así que solo corren en la compu.
    // En la app publicada (GitHub Pages) no hacen nada, para no tocar tus datos reales.
    if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.getElementById('summary').textContent = 'Las pruebas solo se corren en la compu (localhost).';
      await new Promise(() => {}); // se queda acá para siempre
    }

    // Manda el resultado al servidor local (tools/serve.ps1 lo guarda para tools/test.ps1).
    function report(summary) {
      document.getElementById('summary').textContent = summary;
      const lines = [...document.querySelectorAll('#results li')].map((li) => li.textContent);
      fetch('/tests/report', { method: 'POST', body: [...lines, '', `Resultado: ${summary}`].join('\n') }).catch(() => {});
    }
    window.addEventListener('error', (e) => report(`ERROR: ${e.message}`));
    window.addEventListener('unhandledrejection', (e) => report(`ERROR: ${e.reason?.stack || e.reason}`));
    const results = document.getElementById('results');
    let failures = 0;

    function check(name, condition, detail = '') {
      const li = document.createElement('li');
      li.className = condition ? 'ok' : 'fail';
      li.textContent = `${condition ? 'OK' : 'FALLA'} — ${name}${!condition && detail ? ` (${detail})` : ''}`;
      results.append(li);
      if (!condition) failures++;
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    async function waitFor(fn, timeout = 3000) {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        const value = fn();
        if (value) return value;
        await sleep(30);
      }
      return null;
    }

    // ---------- Fechas ----------
    check('addDays cruza fin de mes', dates.addDays('2026-10-31', 1) === '2026-11-01');
    check('diffDays', dates.diffDays('2026-10-05', '2026-10-12') === 7);
    check('formatLongDate', dates.formatLongDate('2026-10-12') === 'lunes 12 de octubre', dates.formatLongDate('2026-10-12'));
    check('relativeDayLabel mañana', dates.relativeDayLabel('2026-10-13', '2026-10-12') === 'Mañana');
    check('relativeDayLabel esta semana', dates.relativeDayLabel('2026-10-14', '2026-10-12') === 'Mié 14');
    check('relativeDayLabel lejos', dates.relativeDayLabel('2026-10-30', '2026-10-12') === '30 oct');
    check('overdueSince ayer', dates.overdueSinceLabel('2026-10-11', '2026-10-12') === 'desde ayer');
    check('overdueSince lunes', dates.overdueSinceLabel('2026-10-05', '2026-10-12') === 'desde el lun 5');
    check('nextMonday desde lunes', dates.nextMonday('2026-10-12') === '2026-10-19');
    check('nextMonday desde miércoles', dates.nextMonday('2026-10-14') === '2026-10-19');
    check('startOfWeek desde miércoles', dates.startOfWeek('2026-10-14') === '2026-10-12');
    check('startOfWeek desde domingo', dates.startOfWeek('2026-10-18') === '2026-10-12');
    check('addMonths cruza el año', dates.addMonths('2026-12-15', 1) === '2027-01-01');
    // 02:30 UTC del 13 = 23:30 del 12 en Montevideo
    check('todayISO usa hora de Montevideo', dates.todayISO(new Date('2026-10-13T02:30:00Z')) === '2026-10-12');
    const ms = dates.msUntilNextMidnight(new Date('2026-10-13T02:30:00Z'));
    check('msUntilNextMidnight', ms === 30 * 60 * 1000, String(ms));

    // ---------- Períodos y variables de los procesos ----------
    const monthlyClose = { frequency: 'monthly', periodOffset: -1, name: 'Cierre de mes' };
    check('Período de cierre en octubre = septiembre', periods.currentPeriod(monthlyClose, '2026-10-12') === '2026-09');
    check('Período de cierre en enero = diciembre anterior', periods.currentPeriod(monthlyClose, '2026-01-05') === '2025-12');
    const vars = periods.periodVariables(monthlyClose, '2026-09');
    check('{MES_CIERRE} octubre 2026 = SEPTIEMBRE', vars.MES_CIERRE === 'SEPTIEMBRE', vars.MES_CIERRE);
    check('{MES_ACTUAL} octubre 2026 = octubre', vars.MES_ACTUAL === 'octubre', vars.MES_ACTUAL);
    check('{MES_CORTE} octubre 2026 = mar-26', vars.MES_CORTE === 'mar-26', vars.MES_CORTE);
    check('{MES_CORTE} mayo 2026 = oct-25', periods.periodVariables(monthlyClose, '2026-04').MES_CORTE === 'oct-25');
    check('resolveText', periods.resolveText('Base de {MES_ACTUAL}: última compra {MES_CORTE} o antes.', vars) === 'Base de octubre: última compra mar-26 o antes.');
    check('Título "Cierre de septiembre"', periods.periodTitle(monthlyClose, '2026-09') === 'Cierre de septiembre');
    check('Semana ISO 12 oct 2026 = W42', periods.isoWeekOf('2026-10-12') === '2026-W42');
    check('Semana ISO 1 ene 2027 = 2026-W53', periods.isoWeekOf('2027-01-01') === '2026-W53', periods.isoWeekOf('2027-01-01'));
    check('Lunes de la W42', periods.mondayOfIsoWeek('2026-W42') === '2026-10-12');
    check('Período semanal', periods.currentPeriod({ frequency: 'weekly', periodOffset: 0 }, '2026-10-14') === '2026-W42');

    // ---------- Datos previos: una atrasada, una hecha ayer, una con fecha futura ----------
    const today = dates.todayISO();
    await store.init();
    // Un cierre anterior, terminado el día 6 del mes en que se trabajó.
    const closeTemplate = store.getTemplate('cierre-de-mes');
    const currentClose = periods.currentPeriod(closeTemplate, today);
    const pastPeriod = periods.addMonths(currentClose, -1);
    const pastWorkStart = periods.periodWorkStart(closeTemplate, pastPeriod);
    await db.put('processRuns', {
      id: `cierre-de-mes:${pastPeriod}`, templateId: 'cierre-de-mes', period: pastPeriod,
      checked: {}, createdAt: `${pastWorkStart}T12:00:00Z`, completedAt: `${dates.addDays(pastWorkStart, 5)}T15:00:00Z`,
    });
    const late = await store.addTask({ title: 'Tarea atrasada', area: 'pdv', bucket: 'hoy' });
    await store.updateTask(late.id, { dueDate: dates.addDays(today, -1) });
    const old = await store.addTask({ title: 'Hecha ayer', area: 'otros', bucket: 'hoy' });
    await store.updateTask(old.id, { done: true, doneAt: new Date(Date.now() - 86400000 * 2).toISOString() });
    await store.addTask({ title: 'Futura', area: 'meta', bucket: 'semana', dueDate: dates.addDays(today, 2) });
    await store.addTask({ title: 'Con hora', area: 'ventas', bucket: 'hoy', time: '09:30' });
    await store.addFollowup({ title: 'Cartel gomería · San José', area: 'carteleria', nextAction: 'Consultar a MTOP', dueDate: dates.addDays(today, -3), owner: 'me' });
    await store.addFollowup({ title: 'Orden E01-000055 sin cliente', area: 'ventas', nextAction: 'Pedir el cliente a sistemas', dueDate: today, owner: 'me' });
    await store.addFollowup({ title: 'Permiso de cartel · Canelones', area: 'carteleria', nextAction: 'Esperar firma', dueDate: dates.addDays(today, 2), owner: 'other', waitingFor: 'propietario' });
    await store.addFollowup({ title: 'Cotización de banners 70×110', area: 'carteleria', nextAction: 'Esperar precio', dueDate: dates.addDays(today, 6), owner: 'other', waitingFor: 'proveedor' });

    // ---------- La app ----------
    const frame = document.getElementById('app');
    frame.src = '../index.html#hoy';
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    const win = frame.contentWindow;
    const doc = win.document;
    const $ = (sel) => doc.querySelector(sel);
    const $$ = (sel) => [...doc.querySelectorAll(sel)];
    const titles = () => $$('.task-row__title').map((n) => n.textContent);

    await waitFor(() => $('.tiles'));
    check('Hoy se dibuja', Boolean($('.tiles')));
    check('Encabezado con fecha', $('.overline')?.textContent === dates.formatLongDate(today));
    check('Atrasada arriba de todo', titles()[0] === 'Tarea atrasada', titles().join(' | '));
    check('Etiqueta "Atrasada · desde ayer"', $$('.tag--danger').some((n) => n.textContent === 'Atrasada · desde ayer'));
    check('Hecha otro día no aparece', !titles().includes('Hecha ayer'));
    check('Futura va en "Esta semana"', $$('.fold .task-row__title').some((n) => n.textContent === 'Futura'));
    check('Tile pendientes = 2', $('.tile__value')?.textContent === '2', $('.tile__value')?.textContent);

    // Captura rápida
    $('#fab').click();
    const input = await waitFor(() => doc.querySelector('.sheet input[type="text"]'));
    check('El + abre el sheet', Boolean(input));
    check('El input tiene el foco', doc.activeElement === input);
    const save = doc.querySelector('.sheet .btn-primary');
    check('Guardar deshabilitado sin texto', save.disabled);
    input.value = 'Llamar a la gomería de Las Piedras';
    input.dispatchEvent(new win.Event('input', { bubbles: true }));
    check('Guardar se habilita con texto', !save.disabled);
    [...doc.querySelectorAll('.sheet .chip')].find((c) => c.textContent === 'PDV').click();
    input.form.requestSubmit(); // equivale a tocar Enter
    await waitFor(() => titles().includes('Llamar a la gomería de Las Piedras'));
    check('La tarea nueva aparece en Hoy', titles().includes('Llamar a la gomería de Las Piedras'));
    check('Toast "Guardada en Hoy"', $('.toast')?.textContent.includes('Guardada en Hoy'));
    await waitFor(() => !doc.querySelector('.sheet-backdrop'), 1000);
    check('El sheet se cierra', !doc.querySelector('.sheet-backdrop'));
    await sleep(100);
    check('Se recuerda la última área', (await db.get('settings', 'lastArea'))?.value === 'pdv');

    // Completar y deshacer
    const rowOf = (title) => $$('.task-row').find((r) => r.querySelector('.task-row__title').textContent === title);
    rowOf('Con hora').querySelector('.check').click();
    await waitFor(() => rowOf('Con hora')?.classList.contains('is-done'));
    check('Completar tacha la tarea', rowOf('Con hora')?.classList.contains('is-done'));
    const todayList = [...doc.querySelector('.list').querySelectorAll('.task-row__title')].map((n) => n.textContent);
    check('Completada baja al final', todayList.at(-1) === 'Con hora', todayList.join(' | '));
    check('"1 hecha"', $('.section-aside')?.textContent === '1 hecha');
    [...doc.querySelectorAll('.toast__action')].at(-1).click();
    await waitFor(() => !rowOf('Con hora')?.classList.contains('is-done'));
    check('Deshacer la desmarca', !rowOf('Con hora')?.classList.contains('is-done'));

    // Editar: pasar a "Esta semana" y volver con "Pasar a hoy"
    rowOf('Llamar a la gomería de Las Piedras').querySelector('.task-row__main').click();
    await waitFor(() => doc.querySelector('.sheet'));
    [...doc.querySelectorAll('.sheet .chip')].find((c) => c.textContent === 'Esta semana').click();
    check('Esta semana borra la fecha de hoy', doc.querySelector('.sheet input[type="date"]').value === '');
    doc.querySelector('.sheet form').requestSubmit();
    await waitFor(() => $$('.fold .task-row__title').some((n) => n.textContent === 'Llamar a la gomería de Las Piedras'));
    check('Editada a "Esta semana"', $$('.fold .task-row__title').some((n) => n.textContent === 'Llamar a la gomería de Las Piedras'));
    await waitFor(() => !doc.querySelector('.sheet-backdrop'), 1000);
    const weekRow = $$('.fold .task-row').find((r) => r.textContent.includes('Llamar a la gomería'));
    weekRow.querySelector('.row-action').click();
    await waitFor(() => !$$('.fold .task-row__title').some((n) => n.textContent.includes('Llamar a la gomería')));
    check('"Pasar a hoy" la devuelve a Hoy', !$$('.fold .task-row__title').some((n) => n.textContent.includes('Llamar a la gomería')));

    // Eliminar con confirmación y deshacer
    rowOf('Tarea atrasada').querySelector('.task-row__main').click();
    await waitFor(() => doc.querySelector('.sheet .btn-danger'));
    const del = doc.querySelector('.sheet .btn-danger');
    del.click();
    check('Eliminar pide confirmación', del.textContent === 'Tocá de nuevo para eliminar');
    del.click();
    await waitFor(() => !rowOf('Tarea atrasada'));
    check('Eliminar la saca', !rowOf('Tarea atrasada'));
    [...doc.querySelectorAll('.toast__action')].at(-1).click();
    await waitFor(() => rowOf('Tarea atrasada'));
    check('Deshacer la restaura', Boolean(rowOf('Tarea atrasada')));

    // Persistencia: recargar y ver que sigue todo
    frame.contentWindow.location.reload();
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await waitFor(() => frame.contentWindow.document.querySelector('.tiles'));
    const after = [...frame.contentWindow.document.querySelectorAll('.task-row__title')].map((n) => n.textContent);
    check('Los datos sobreviven a recargar', after.includes('Llamar a la gomería de Las Piedras') && after.includes('Tarea atrasada'), after.join(' | '));

    // ---------- Procesos ----------
    const pw = frame.contentWindow;
    const pd = pw.document;
    // Vigilamos errores en la consola de la app durante el resto de las pruebas.
    const consoleErrors = [];
    pw.addEventListener('error', (e) => consoleErrors.push(e.message));
    pw.addEventListener('unhandledrejection', (e) => consoleErrors.push(String(e.reason)));
    const originalError = pw.console.error;
    pw.console.error = (...args) => { consoleErrors.push(args.join(' ')); originalError.apply(pw.console, args); };
    const p$ = (sel) => pd.querySelector(sel);
    const p$$ = (sel) => [...pd.querySelectorAll(sel)];
    check('Tile "Cierre de mes" arranca en 0/9', p$$('.tile__value')[2]?.textContent === '0/9', p$$('.tile__value')[2]?.textContent);
    p$$('.tile')[2].click(); // el tile lleva a Procesos
    await waitFor(() => p$('.title')?.textContent === 'Procesos');
    check('El tile navega a Procesos', p$('.title')?.textContent === 'Procesos');
    const expectedTitle = periods.periodTitle(closeTemplate, currentClose);
    check(`Tarjeta "${expectedTitle}"`, p$('.process-card__title')?.textContent === expectedTitle, p$('.process-card__title')?.textContent);
    check('Se creó el checklist del período (9 pasos)', p$$('.step-row').length === 9);
    const stepTexts = p$$('.step-row__text').map((n) => n.textContent);
    const currentVars = periods.periodVariables(closeTemplate, currentClose);
    check('Variables reemplazadas en los pasos', !stepTexts.some((t) => t.includes('{')) && stepTexts.some((t) => t.includes(`BASE GENERAL ${currentVars.MES_CIERRE}`)));
    check('Nota en ámbar con la trampa', p$$('.step-row__note').some((n) => n.textContent.includes('AxTable1')));

    p$$('.step-row')[0].click();
    await waitFor(() => p$('.process-card__sub')?.textContent.startsWith('1 de 9'));
    check('Marcar un paso: "1 de 9 pasos · faltan 8"', p$('.process-card__sub')?.textContent === '1 de 9 pasos · faltan 8', p$('.process-card__sub')?.textContent);
    check('Contador del grupo "1/3"', p$('.section-aside')?.textContent === '1/3');
    check('Porcentaje 11%', p$('.process-card__percent')?.textContent === '11%');

    // Marcar todos los que faltan
    for (let i = 1; i < 9; i++) {
      p$$('.step-row')[i].click();
      await waitFor(() => p$$('.step-row')[i]?.getAttribute('aria-checked') === 'true');
    }
    await waitFor(() => p$('.process-card__legend.is-done'));
    check('Al terminar: "Mes cerrado ✓ el …"', p$('.process-card__legend.is-done')?.textContent.startsWith('Mes cerrado ✓ el'), p$('.process-card__legend')?.textContent);
    check('Toast de celebración', p$('.toast')?.textContent.includes('terminado'));
    check('Animación de celebración', Boolean(p$('.process-card.is-celebrating')));

    // Desmarcar uno vuelve a abrir el período
    p$$('.step-row')[8].click();
    await waitFor(() => !p$('.process-card__legend.is-done'));
    check('Desmarcar reabre el período', !p$('.process-card__legend.is-done'));
    p$$('.step-row')[8].click();
    await waitFor(() => p$('.process-card__legend.is-done'));

    // Historial
    [...p$$('.process-card__actions button')].find((b) => b.textContent.includes('historial')).click();
    await waitFor(() => pd.querySelector('.sheet .history-row'));
    const historyText = pd.querySelector('.sheet .history-row')?.textContent ?? '';
    check('Historial muestra el cierre anterior y los días', historyText.includes(periods.periodTitle(closeTemplate, pastPeriod)) && historyText.includes('tardaste 6 días'), historyText);
    pd.querySelector('.sheet__cancel').click();
    await waitFor(() => !pd.querySelector('.sheet-backdrop'), 1000);

    // Editar plantilla: agregar un paso al primer grupo
    [...p$$('.process-card__actions button')].find((b) => b.textContent.includes('Editar')).click();
    await waitFor(() => pd.querySelector('.sheet .editor-group'));
    check('El editor muestra los 3 grupos', pd.querySelectorAll('.sheet .editor-group').length === 3);
    pd.querySelector('.sheet .editor-group .btn-text').click();
    const newStep = await waitFor(() => {
      const inputs = [...pd.querySelectorAll('.sheet .editor-group')][0].querySelectorAll('.editor-step textarea:not(.field__input--note)');
      return inputs.length === 4 ? inputs[3] : null;
    });
    check('"Agregar paso" agrega un campo y lo enfoca', Boolean(newStep) && pd.activeElement === newStep);
    newStep.value = 'Chequear totales contra el sistema';
    newStep.dispatchEvent(new pw.Event('input', { bubbles: true }));
    [...pd.querySelectorAll('.sheet .btn-primary')].at(-1).click();
    await waitFor(() => p$$('.step-row').length === 10);
    check('Paso nuevo guardado (10 pasos)', p$$('.step-row').length === 10);
    check('Lo marcado se conserva: "9 de 10 pasos · faltan 1"', p$('.process-card__sub')?.textContent === '9 de 10 pasos · faltan 1', p$('.process-card__sub')?.textContent);

    // Nueva plantilla semanal (antes esperamos que el sheet anterior termine de cerrarse)
    await waitFor(() => !pd.querySelector('.sheet-backdrop'), 1000);
    p$$('.btn-add').at(-1).click();
    await waitFor(() => pd.querySelector('.sheet .editor-group'));
    const nameIn = pd.querySelector('.sheet .field__input--big');
    nameIn.value = 'Revisión semanal';
    nameIn.dispatchEvent(new pw.Event('input', { bubbles: true }));
    [...pd.querySelectorAll('.sheet .chip')].find((c) => c.textContent === 'Todas las semanas').click();
    const firstStep = pd.querySelector('.sheet .editor-step textarea');
    firstStep.value = 'Revisar seguimientos vencidos';
    firstStep.dispatchEvent(new pw.Event('input', { bubbles: true }));
    [...pd.querySelectorAll('.sheet .btn-primary')].at(-1).click();
    await waitFor(() => p$('.process-card__title')?.textContent.startsWith('Revisión semanal · semana del'));
    check('Plantilla semanal creada y seleccionada', p$('.process-card__title')?.textContent.startsWith('Revisión semanal · semana del'), p$('.process-card__title')?.textContent);
    check('Aparece el selector de procesos', p$$('.view > .field .chip').length === 2, String(p$$('.view > .field .chip').length) + ' chips; ' + p$$('.chip').map((c) => c.textContent).join(','));

    // ---------- Seguimientos ----------
    const closed = () => waitFor(() => !pd.querySelector('.sheet-backdrop'), 1000);
    const cardOf = (title) => p$$('.fu-card').find((c) => c.querySelector('.fu-card__title')?.textContent === title);
    const chipOf = (text) => p$$('.view .chip').find((c) => c.textContent.startsWith(text));
    const lastToastAction = () => [...pd.querySelectorAll('.toast__action')].at(-1);

    pw.location.hash = 'hoy';
    await waitFor(() => p$('.tiles'));
    check('Globito rojo en la pestaña = 1', p$('#badge-seguimientos')?.textContent === '1' && !p$('#badge-seguimientos').hidden);
    check('Tile de vencidos en rojo = 1', p$('.tile__value--danger')?.textContent === '1');
    const waiting = p$$('.followup-row__title').map((n) => n.textContent);
    check('"Esperando a alguien": solo los de los próximos 3 días', waiting.includes('Permiso de cartel · Canelones') && !waiting.includes('Cotización de banners 70×110'), waiting.join(' | '));

    p$$('.tile')[1].click(); // tile de vencidos
    await waitFor(() => p$('.title')?.textContent === 'Seguimientos');
    check('El tile lleva a Seguimientos filtrado por Vencidos', chipOf('Vencidos')?.getAttribute('aria-pressed') === 'true' && p$$('.fu-card').length === 1);
    check('Vencido en rojo con "Venció …"', cardOf('Cartel gomería · San José')?.classList.contains('is-overdue') && cardOf('Cartel gomería · San José').querySelector('.date-pill--danger')?.textContent.startsWith('Venció'));

    chipOf('Todos').click();
    await waitFor(() => p$$('.fu-card').length === 4);
    check('Filtro Todos: 4 tarjetas, vencido arriba', p$$('.fu-card').length === 4 && p$('.fu-card__title')?.textContent === 'Cartel gomería · San José');
    check('Contadores de filtros', ['Todos4', 'Vencidos1', 'Me toca2', 'Esperando2'].every((t) => p$$('.view .chip').some((c) => c.textContent === t)), p$$('.view .chip').map((c) => c.textContent).join(','));
    check('Pastilla "Hoy" y "Esperando a otro · propietario"', cardOf('Orden E01-000055 sin cliente')?.querySelector('.date-pill--today')?.textContent === 'Hoy' && cardOf('Permiso de cartel · Canelones')?.querySelector('.owner-pill')?.textContent === 'Esperando a otro · propietario');

    // Detalle: posponer + deshacer
    cardOf('Orden E01-000055 sin cliente').querySelector('.fu-card__main').click();
    await waitFor(() => pd.querySelector('.sheet .sheet-section'));
    [...pd.querySelectorAll('.sheet .chip')].find((c) => c.textContent === '+1 día').click();
    await waitFor(() => pd.querySelector('.sheet .date-pill')?.textContent === 'Mañana');
    check('Posponer +1 día → "Mañana"', pd.querySelector('.sheet .date-pill')?.textContent === 'Mañana');
    check('Posponer queda en la bitácora', pd.querySelector('.sheet .log-row__text')?.textContent.startsWith('Pospuesto para el'));
    lastToastAction().click();
    await waitFor(() => pd.querySelector('.sheet .date-pill')?.textContent === 'Hoy');
    check('Deshacer posponer', pd.querySelector('.sheet .date-pill')?.textContent === 'Hoy' && !pd.querySelector('.sheet .log-row'));

    // Registrar avance
    const progressText = pd.querySelector('.sheet .sheet-section textarea');
    progressText.value = 'Sistemas dice que lo revisa mañana';
    progressText.dispatchEvent(new pw.Event('input', { bubbles: true }));
    const nextIn = [...pd.querySelectorAll('.sheet .sheet-section input[type="text"]')][0];
    nextIn.value = 'Volver a consultar a sistemas';
    [...pd.querySelectorAll('.sheet .btn-secondary')].find((b) => b.textContent.includes('Registrar avance')).click();
    await waitFor(() => pd.querySelector('.sheet .log-row__text')?.textContent === 'Sistemas dice que lo revisa mañana');
    check('Registrar avance agrega a la bitácora', pd.querySelector('.sheet .log-row__text')?.textContent === 'Sistemas dice que lo revisa mañana');
    check('Registrar avance actualiza la próxima acción y la fecha', pd.querySelector('.sheet .fu-card__next')?.textContent === 'Volver a consultar a sistemas' && pd.querySelector('.sheet .date-pill')?.textContent === 'Mañana');

    // Marcar resuelto desde el detalle + deshacer
    [...pd.querySelectorAll('.sheet .btn-primary')].find((b) => b.textContent === 'Marcar resuelto').click();
    await closed();
    await waitFor(() => !cardOf('Orden E01-000055 sin cliente'));
    check('Resuelto sale de la lista', !cardOf('Orden E01-000055 sin cliente'));
    check('Aparece en "Resueltos"', p$$('.fold .followup-row__title').some((n) => n.textContent === 'Orden E01-000055 sin cliente'));
    lastToastAction().click();
    await waitFor(() => cardOf('Orden E01-000055 sin cliente'));
    check('Deshacer resuelto', Boolean(cardOf('Orden E01-000055 sin cliente')));

    // Marcar resuelto desde la tarjeta
    cardOf('Cotización de banners 70×110').querySelector('.fu-resolve').click();
    await waitFor(() => !cardOf('Cotización de banners 70×110'));
    check('"Marcar resuelto" desde la tarjeta', !cardOf('Cotización de banners 70×110'));

    // Captura de seguimiento desde el +
    p$('#fab').click();
    const fuTitle = await waitFor(() => pd.querySelector('.sheet input[type="text"]'));
    fuTitle.value = 'Cotización vinilo · Florida';
    fuTitle.dispatchEvent(new pw.Event('input', { bubbles: true }));
    [...pd.querySelectorAll('.sheet .chip')].find((c) => c.textContent === 'Es un seguimiento').click();
    check('"Es un seguimiento" muestra sus campos', !pd.querySelector('.sheet .form-group--wide').hidden && pd.querySelector('.sheet details.more').hidden);
    pd.querySelector('.sheet .form-group--wide input[type="text"]').value = 'Pedir precio con instalación';
    [...pd.querySelectorAll('.sheet .chip')].find((c) => c.textContent === 'En 3 días').click();
    [...pd.querySelectorAll('.sheet .chip')].find((c) => c.textContent === 'Esperando a otro').click();
    const whoIn = [...pd.querySelectorAll('.sheet .form-group--wide input[type="text"]')].at(-1);
    whoIn.value = 'proveedor';
    fuTitle.form.requestSubmit();
    await waitFor(() => cardOf('Cotización vinilo · Florida'));
    const newCard = cardOf('Cotización vinilo · Florida');
    check('Seguimiento cargado desde el +', Boolean(newCard) && p$$('.toast').at(-1)?.textContent.includes('Guardado en Seguimientos'));
    check('Con próxima acción, fecha en 3 días y "Esperando a otro · proveedor"',
      newCard?.querySelector('.fu-card__next')?.textContent === 'Pedir precio con instalación'
      && newCard?.querySelector('.date-pill')?.textContent === dates.relativeDayLabel(dates.addDays(today, 3), today)
      && newCard?.querySelector('.owner-pill')?.textContent === 'Esperando a otro · proveedor');
    await closed();

    // Eliminar con confirmación + deshacer
    newCard.querySelector('.fu-card__main').click();
    await waitFor(() => pd.querySelector('.sheet .btn-danger'));
    const delFu = pd.querySelector('.sheet .btn-danger');
    delFu.click();
    delFu.click();
    await waitFor(() => !cardOf('Cotización vinilo · Florida'));
    check('Eliminar seguimiento', !cardOf('Cotización vinilo · Florida'));
    lastToastAction().click();
    await waitFor(() => cardOf('Cotización vinilo · Florida'));
    check('Deshacer eliminar seguimiento', Boolean(cardOf('Cotización vinilo · Florida')));
    await sleep(300);

    // ---------- Fase 5: Ajustes ----------
    // Usamos el MISMO store que la app (mismo módulo, misma URL) para revisar datos.
    const bridge = pd.createElement('script');
    bridge.type = 'module';
    bridge.textContent = "import * as s from './js/store.js'; window.__store = s;";
    pd.head.append(bridge);
    const appStore = await waitFor(() => pw.__store);
    const settingsButton = (text) => p$$('.view .btn-secondary').find((b) => b.textContent.includes(text));

    pw.location.hash = 'hoy';
    await waitFor(() => p$('.avatar'));
    p$('.avatar').click();
    await waitFor(() => p$('.title')?.textContent === 'Ajustes');
    check('El avatar abre Ajustes', p$('.title')?.textContent === 'Ajustes');
    check('En Ajustes ninguna pestaña queda activa', !p$('.tab[aria-current]'));
    check('Aviso de backup (nunca se hizo)', p$('.backup-status.is-warning')?.textContent.startsWith('Todavía no hiciste ningún backup'));

    // Áreas: renombrar, agregar y ocultar
    p$$('.settings-row').find((r) => r.textContent.includes('PDV')).click();
    await waitFor(() => pd.querySelector('.sheet .swatch'));
    const areaName = pd.querySelector('.sheet .field__input--big');
    areaName.value = 'Puntos de venta';
    areaName.dispatchEvent(new pw.Event('input', { bubbles: true }));
    pd.querySelectorAll('.sheet .swatch')[5].click(); // Coral
    check('Vista previa de la etiqueta', pd.querySelector('.sheet .area-preview .tag')?.textContent === 'Puntos de venta');
    pd.querySelector('.sheet .btn-primary').click();
    await waitFor(() => p$$('.settings-row').some((r) => r.textContent.includes('Puntos de venta')));
    check('Renombrar área', appStore.getArea('pdv').name === 'Puntos de venta' && appStore.getArea('pdv').color === '#FF9F8A');
    await closed();
    p$$('.btn-add').find((b) => b.textContent.includes('Agregar área')).click();
    await waitFor(() => pd.querySelector('.sheet .swatch'));
    const newArea = pd.querySelector('.sheet .field__input--big');
    newArea.value = 'Capacitaciones';
    newArea.dispatchEvent(new pw.Event('input', { bubbles: true }));
    pd.querySelector('.sheet .btn-primary').click();
    await waitFor(() => p$$('.settings-row').some((r) => r.textContent.includes('Capacitaciones')));
    check('Agregar área', p$$('.settings-row').some((r) => r.textContent.includes('Capacitaciones')));
    await closed();
    p$$('.settings-row').find((r) => r.textContent.includes('Capacitaciones')).click();
    await waitFor(() => pd.querySelector('.sheet .chip'));
    [...pd.querySelectorAll('.sheet .chip')].find((c) => c.textContent === 'Oculta').click();
    pd.querySelector('.sheet .btn-primary').click();
    await waitFor(() => p$$('.settings-row').find((r) => r.textContent.includes('Capacitaciones'))?.textContent.includes('Oculta'));
    await closed();
    p$('#fab').click();
    await waitFor(() => pd.querySelector('.sheet .chip'));
    const captureChips = [...pd.querySelectorAll('.sheet .chip')].map((c) => c.textContent);
    check('Área oculta no aparece al cargar', !captureChips.includes('Capacitaciones') && captureChips.includes('Puntos de venta'));
    pd.querySelector('.sheet__cancel').click();
    await closed();

    // Backup: exportar, validar e importar
    const backup = await appStore.exportBackup();
    check('Exportar: formato con versión de esquema', backup.app === 'centro-mando' && backup.schemaVersion === 1 && Array.isArray(backup.data.tasks) && backup.data.tasks.length === appStore.getTodayTasks().length + appStore.getWeekTasks().length + appStore.getSomedayTasks().length + 1);
    check('Importar: rechaza un archivo que no es JSON', Boolean(appStore.parseBackup('{roto').error));
    check('Importar: rechaza otro tipo de archivo', Boolean(appStore.parseBackup(JSON.stringify({ app: 'otra' })).error));
    check('Importar: rechaza datos dañados', Boolean(appStore.parseBackup(JSON.stringify({ ...backup, data: { ...backup.data, tasks: [{ id: 1 }] } })).error));
    check('Importar: rechaza versión más nueva', Boolean(appStore.parseBackup(JSON.stringify({ ...backup, schemaVersion: 99 })).error));
    const parsed = appStore.parseBackup(JSON.stringify(backup));
    check('Importar: vista previa con cantidades', !parsed.error && parsed.counts.followups === backup.data.followups.length && parsed.counts.templates === 2);
    const victim = appStore.getTodayTasks().find((t) => t.title === 'Tarea atrasada');
    await appStore.deleteTask(victim.id);
    await appStore.importBackup(parsed.backup);
    check('Importar reemplaza y recupera los datos', appStore.getTodayTasks().some((t) => t.title === 'Tarea atrasada'));

    // Resumen del día
    const summary = appStore.buildDaySummary();
    check('Resumen del día', summary.startsWith('Resumen del ') && summary.includes('Pendiente (') && summary.includes('Seguimientos vencidos (1)') && summary.includes('Cartel gomería · San José'), summary);

    // Tareas hechas
    pw.location.hash = 'hoy';
    await waitFor(() => p$('.avatar'));
    p$('.avatar').click();
    await waitFor(() => p$('.title')?.textContent === 'Ajustes');
    settingsButton('Ver tareas hechas').click();
    await waitFor(() => pd.querySelector('.sheet .history-row'));
    check('Historial de tareas hechas (incluye las de otros días)', [...pd.querySelectorAll('.sheet .history-row__title')].some((n) => n.textContent === 'Hecha ayer'));
    pd.querySelector('.sheet__cancel').click();
    await closed();

    // Datos de ejemplo
    settingsButton('Cargar datos de ejemplo').click();
    await waitFor(() => appStore.hasSampleData());
    check('Cargar datos de ejemplo (4 tareas + 5 seguimientos)', appStore.getTodayTasks().filter((t) => t.sample).length === 4 && appStore.getOpenFollowups().filter((f) => f.sample).length === 5);
    await waitFor(() => settingsButton('Borrar datos de ejemplo') && !settingsButton('Borrar datos de ejemplo').disabled);
    settingsButton('Borrar datos de ejemplo').click();
    await waitFor(() => !appStore.hasSampleData());
    check('Borrar datos de ejemplo sin tocar lo propio', !appStore.hasSampleData() && appStore.getTodayTasks().some((t) => t.title === 'Tarea atrasada'));

    // Deslizar una tarea: "Mañana"
    pw.location.hash = 'hoy';
    const rowNow = (title) => p$$('.task-row').find((r) => r.querySelector('.task-row__title').textContent === title);
    await waitFor(() => rowNow('Tarea atrasada'));
    const swipeRow = rowNow('Tarea atrasada');
    const swipeContent = swipeRow.querySelector('.task-row__content');
    const pointer = (type, x) => swipeContent.dispatchEvent(new pw.PointerEvent(type, { bubbles: true, clientX: x, clientY: 100, pointerId: 7, pointerType: 'touch', isPrimary: true }));
    pointer('pointerdown', 300);
    pointer('pointermove', 280);
    pointer('pointermove', 200);
    pointer('pointermove', 120);
    pointer('pointerup', 120);
    check('Deslizar a la izquierda muestra las acciones', swipeRow.classList.contains('is-swiped') && swipeRow.querySelector('.task-row__actions').getAttribute('aria-hidden') === 'false');
    swipeRow.querySelector('.swipe-action--later').click();
    await waitFor(() => p$$('.fold .task-row__title').some((n) => n.textContent === 'Tarea atrasada'));
    const tomorrowRow = p$$('.fold .task-row').find((r) => r.textContent.includes('Tarea atrasada'));
    check('"Mañana" la pasa a mañana', Boolean(tomorrowRow) && tomorrowRow.textContent.includes('Mañana'));

    // ---------- Calendario ----------
    const calToday = dates.todayISO();
    const calTomorrow = dates.addDays(calToday, 1);
    await appStore.addTask({ title: 'Cal: reunión', area: 'meta', bucket: 'semana', dueDate: calTomorrow, time: '10:00' });
    await appStore.addTask({ title: 'Cal: sin fecha', area: 'otros', bucket: 'algun_dia' });
    const calItems = appStore.getCalendarItems(calToday, dates.addDays(calToday, 7));
    check('Calendario: tarea con fecha y hora en su día', (calItems[calTomorrow] ?? []).some((i) => i.title === 'Cal: reunión' && i.time === '10:00' && i.date === calTomorrow));
    check('Calendario: las tareas sin fecha no aparecen', !Object.values(calItems).flat().some((i) => i.title === 'Cal: sin fecha'));
    check('Calendario: seguimientos abiertos en su fecha límite', Object.values(calItems).flat().some((i) => i.kind === 'followup'));
    const sorted = (calItems[calTomorrow] ?? []).map((i) => Boolean(i.time));
    check('Calendario: primero lo que no tiene hora', sorted.indexOf(true) === -1 || !sorted.slice(sorted.indexOf(true)).includes(false));

    pw.location.hash = 'calendario';
    await waitFor(() => p$('.segmented'));
    check('Pestaña Calendario', p$('.title')?.textContent === 'Calendario' && p$('.tab[data-tab="calendario"]')?.getAttribute('aria-current') === 'page');
    check('Calendario: arranca en Día, con hoy', p$('.segmented__btn[aria-pressed="true"]')?.textContent === 'Día' && p$('.cal-nav__today')?.disabled);
    p$$('.cal-nav .icon-btn')[1].click(); // día siguiente
    await waitFor(() => p$$('.cal-block').some((b) => b.textContent.includes('Cal: reunión')));
    check('Calendario: ‹ › cambia de día y muestra el bloque a su hora', p$$('.cal-block').some((b) => b.textContent.includes('Cal: reunión')) && !p$('.cal-nav__today').disabled);

    // Tocar un horario libre abre la captura con ese día y hora
    p$$('.cal-slot').find((s) => s.getAttribute('aria-label').endsWith('a las 15:00')).click();
    await waitFor(() => pd.querySelector('.sheet input[type="date"]'));
    const calDate = pd.querySelector('.sheet input[type="date"]');
    const calTime = pd.querySelector('.sheet input[type="time"]');
    check('Calendario: tocar un horario prellena día y hora', calDate?.value === calTomorrow && calTime?.value === '15:00', `${calDate?.value} ${calTime?.value}`);
    const calTitle = pd.querySelector('.sheet .field__input--big');
    calTitle.value = 'Cal: desde la grilla';
    calTitle.dispatchEvent(new pw.Event('input', { bubbles: true }));
    pd.querySelector('.sheet .btn-primary').click();
    await waitFor(() => p$$('.cal-block').some((b) => b.textContent.includes('Cal: desde la grilla')));
    const fromGrid = appStore.getWeekTasks().find((t) => t.title === 'Cal: desde la grilla');
    check('Calendario: la tarea se guarda en ese día y hora', fromGrid?.dueDate === calTomorrow && fromGrid?.time === '15:00');
    await closed();

    // Tocar un bloque abre la tarea para editarla
    p$$('.cal-block').find((b) => b.textContent.includes('Cal: reunión')).click();
    await waitFor(() => pd.querySelector('.sheet__title')?.textContent === 'Editar tarea');
    check('Calendario: tocar una tarea la abre para editar', pd.querySelector('.sheet .field__input--big')?.value === 'Cal: reunión');
    pd.querySelector('.sheet__cancel').click();
    await closed();

    // Semana laboral
    p$$('.segmented__btn').find((b) => b.textContent === 'Semana').click();
    await waitFor(() => p$('.cal-grid--week'));
    check('Calendario: semana de lunes a viernes', p$$('.cal-grid--week .cal-col').length === 5 && p$$('.cal-week-head__name')[0]?.textContent === 'lun');

    // Mes
    p$$('.segmented__btn').find((b) => b.textContent === 'Mes').click();
    await waitFor(() => p$('.cal-month'));
    const monthDays = p$$('.cal-day');
    check('Calendario: mes en semanas completas', monthDays.length % 7 === 0 && monthDays.length >= 28);
    p$('.cal-nav__today').click();
    await waitFor(() => p$('.cal-day.is-today[aria-pressed="true"]'));
    check('Calendario: "Hoy" vuelve al día de hoy', Boolean(p$('.cal-day.is-today[aria-pressed="true"]')));
    const tomorrowCell = p$$('.cal-day').find((d) => d.getAttribute('aria-label').startsWith(dates.formatLongDate(calTomorrow)));
    tomorrowCell?.click();
    await waitFor(() => p$$('.cal-row__title').some((t) => t.textContent === 'Cal: reunión'));
    check('Calendario: tocar un día muestra su lista', p$$('.cal-row__title').some((t) => t.textContent === 'Cal: reunión'));

    check('Sin errores en la consola', consoleErrors.length === 0, consoleErrors.join(' | '));

    report(failures === 0 ? 'TODO OK' : `${failures} FALLAS`);
  </script>
</body>
</html>
