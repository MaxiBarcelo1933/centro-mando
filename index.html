<!doctype html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Centro de Mando</title>
  <meta name="description" content="Tareas de hoy, procesos que se repiten y seguimientos.">

  <!-- Para que se comporte como app instalada en el iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mando">
  <meta name="theme-color" content="#0E1116">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Banner "Instalala en tu iPhone" (solo en Safari sin instalar) -->
    <div class="install-banner" id="install-banner" role="region" aria-label="Instalar la app" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12M8 7l4-4 4 4"/>
        <path d="M6 11v8.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V11"/>
      </svg>
      <p>Instalala en tu iPhone: <strong>Compartir → Agregar a inicio</strong></p>
      <button class="icon-btn" type="button" id="install-banner-close" aria-label="Descartar aviso de instalación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <!-- Acá se dibuja la sección activa -->
    <main class="content" id="view" tabindex="-1"></main>

    <button class="fab" type="button" id="fab" aria-label="Nueva tarea">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <nav class="tabbar" aria-label="Secciones">
      <button class="tab" type="button" data-tab="hoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
          <path d="M3.5 10h17M8 3v4M16 3v4"/>
        </svg>
        <span>Hoy</span>
      </button>
      <button class="tab" type="button" data-tab="procesos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6.5l1.7 1.7L9 5M4 12.5l1.7 1.7L9 11M4 18.5l1.7 1.7L9 17"/>
          <path d="M12.5 7h7.5M12.5 13h7.5M12.5 19h7.5"/>
        </svg>
        <span>Procesos</span>
      </button>
      <button class="tab" type="button" data-tab="seguimientos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M12 7.5V12l3 2"/>
        </svg>
        <span>Seguimientos</span>
        <span class="tab__badge" id="badge-seguimientos" hidden></span>
      </button>
    </nav>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
